# Default values for mysql-cluster.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""


# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# The below are the values for the init containers used in StatefulSet Deployment
initContainer:
  xtrabackup:
    name: init-xtrabackup
    image:
      repository: percona/percona-xtrabackup
      pullPolicy: IfNotPresent
      tag: "8.4"
    command:
      - bash
      - "-c"
      - |
        set -ex

        # skip the clone if data already exists.
        [[ -d /var/lib/mysql/mysql ]] && exit 0

        # skip the clone on primary (ordinal index 0)
        [[ `hostname` =~ -([0-9]+)$ ]] || exit 1
        ordinal=${BASH_REMATCH[1]}
        [[ $ordinal -eq 0 ]] && exit 0

        # clone the data from previous peer.

        #ncat --recv-only mysql-$(($ordinal-1)).mysql 3307 | xbsstream -x -C /var/lib/mysql
        socat TCP:mysql-cluster-$((${ordinal}-1)).mysql-cluster:3307 EXEC:"xbstream -x -C /var/lib/mysql"
        
        # Prepare the backup
        xtrabackup --prepare --target-dir=/var/lib/mysql
    volumeMounts:
      - name: data
        mountPath: /var/lib/mysql
        subPath: mysql
      - name: conf
        mountPath: /etc/mysql/conf.d
  mysql:
    name: init-mysql
    image:
      repository: mysql
      pullPolicy: IfNotPresent
      tag: "9"
    command:
      - bash
      - "-c"
      - |
        set -ex

        # Generate mysql server-id from pod ordinal index.
        [[ $HOSTNAME =~ -([0-9]+)$ ]] || exit 1
        ordinal=${BASH_REMATCH[1]}
        echo [mysqld] > /mnt/conf.d/server-id.cnf

        # Add an offset to avoid reserved server-id=0 value.

        echo server-id=$((100 + $ordinal)) >> /mnt/conf.d/server-id.cnf

        # Copy appropriate conf.d files from config-map to emptyDir.
        if [[ $ordinal -eq 0 ]]; then
          cp /mnt/config-map/primary.cnf /mnt/conf.d/
        else
          cp /mnt/config-map/replica.cnf /mnt/conf.d/
        fi
    volumeMounts:
      - mountPath: /mnt/conf.d
        name: conf
      - mountPath: /mnt/config-map
        name: config-map

container:
  xtrabackup:
    name: xtrabackup
    image:
      repository: percona/percona-xtrabackup
      tag: "8.4"
      pullPolicy: IfNotPresent
    securityContext:
      runAsUser: 0
    command:
      - bash
      - "-c"
      - |
        set -ex
        cd /var/lib/mysql

        # Determine binlog position of cloned data, if any.
        
        # Check if the `xtrabackup_slave_info` file is present & it's not empty
        if [[ -f xtrabackup_slave_info && "x$(<xtrabackup_slave_info)" != "x" ]]; then

          # XtraBackup already generated a partial "CHANGE MASTER TO" query
          # because we are cloning from an existing replica. (Need to remove the tailing semicolon!)
          cat xtrabackup_slave_info | sed -E 's/;$//g' > change_master_to.sql.in

          # Ignore xtrabackup_binlog_info in this case (it's useless).
          rm -f xtrabackup_slave_info xtrabackup_binlog_info
        
        elif [[ -f xtrabackup_binlog_info ]]; then
          # We're cloning directly from primary. Parse binlog position.

          [[ `cat xtrabackup_binlog_info` = ^(.*?)[[:space:]]+(.*?)$ ]] || exit 1

          rm -f xtrabackup_binlog_info xtrabackup_slave_info

          echo "CHANGE MASTER TO MASTER_LOG_FILE='${BASH_REMATCH[1]',\
          MASTER_LOG_POS=${BASH_REMATCH[2]}}" > change_master_to.sql.in
        fi

        # Check if we need to complete a clone by starting replication

        if [[ -f change_master_to.sql.in ]]; then
          echo "Waiting for mysqld to be ready (accepting connections)"

          until mysql -h 127.0.0.1 -e "SELECT 1"; do sleep 1; done

          echo "Initializing replication from clone position"

          mysql -h 127.0.0.1 \
                -e "$(<change_master_to.sql.in), \
                        MASTER_HOST='mysql-cluster-0.mysql-cluster', \
                        MASTER_USER='root', \
                        MASTER_PASSWORD='${MYSQL_ROOT_PASSWORD}', \
                        MASTER_CONNECT_RETRY=10; \
                    START SLAVE;" || exit 1

          # In case of container restart, attempt this at-most-once.
          mv change_master_to.sql.in change_master_to.sql.orig
        fi

        # Start a server to send backups when requested by peers.
        #exec ncat --listen --keep-open --send-only --max-conns=1 3307 -c \
        #  "xtrabackup --backup --slave-info --stream=xbstream --host=127.0.0.1 --user=root"
        
        exec socat TCP-LISTEN:3307,fork,reuseaddr,max-children=1,keepalive  \
                   SYSTEM:"xtrabackup --backup --slave-info --stream=xbstream \
                   --host=127.0.0.1 --user=root",pty,raw,echo=0
    volumeMounts:
      - name: data
        mountPath: /var/lib/mysql
        subPath: mysql
      - name: conf
        mountPath: /etc/mysql/conf.d
    resources:
      requests:
        cpu: 100m
        memory: 128Mi

  mysql:
    image:
      repository: mysql
      pullPolicy: IfNotPresent
      tag: "9"
    envFrom:
      - configMapRef:
          name: mysql-conf
      - secretRef:
          name: mysql-cluster-password
    securityContext:
       capabilities:
         drop:
         - ALL
       runAsNonRoot: true
       runAsUser: 999
       allowPrivilegeEscalation: false
    volumeMounts:
      - name: conf
        mountPath: /etc/mysql/conf.d
      - name: data
        mountPath: /var/lib/mysql
        subPath: mysql
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
    livenessProbe:
      exec:
        command:
          - "sh"
          - "-c"
          - "mysqladmin ping -u root -p'${MYSQL_ROOT_PASSWORD}'"
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5

    readinessProbe:
      exec:
        command:
          - "sh"
          - "-c"
          - "mysql -u root -p'${MYSQL_ROOT_PASSWORD}' -e 'SELECT 1;' "

      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5




# StatefulSet Pod Spec level Values
statefulSet:
  replicaCount: 1
  # This is for setting Kubernetes Annotations to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}
  # This is for setting Kubernetes Labels to a Pod.
  # For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}

  podSecurityContext:
     fsGroup: 999

  # global volumes defined for StatefulSet Deployment
  volumes:
    - name: conf
      emptyDir: {}
    - name: config-map
      configMap:
        name: mysql-cluster-conf



# Service Values
# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 3306



# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local


nodeSelector: {}

tolerations: []

affinity: {}


