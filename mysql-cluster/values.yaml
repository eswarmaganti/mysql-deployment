  dockerConfig:
    name: docker-config-secret
    dockerConfigJSON: ewogICJhdXRocyI6IHsKICAgICJodHRwczovL2luZGV4LmRvY2tlci5pby92MS8iOiB7CiAgICAgICJ1c2VybmFtZSI6ICJteXVzZXIiLAogICAgICAicGFzc3dvcmQiOiAibXlwYXNzd29yZCIsCiAgICAgICJlbWFpbCI6ICJteWVtYWlsQGV4YW1wbGUuY29tIiwKICAgICAgImF1dGgiOiAiYlhsMWMyVnlPbTE1Y0dGemMzZHZjbVE9IgogICAgfQogIH0KfQo= # ${DOCKER_CONFIG_JSON} from env
